name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Least privilege: CI only needs to read the repo. Each workflow declares its own scopes, so the
# repository default can stay read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build once. Lint and Test both need the built dist/*.d.ts of the workspace @stone-js/*
  # dependencies, so they cannot start before this; they then run in parallel (see `needs`).
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Every lockfile, not only the root one: a starter with its own lockfile resolves independently,
      # so the root's `pnpm.overrides` never reached it and neither did the audit. That is how a
      # vulnerable transitive dependency sat in a template developers scaffold from, seen by Dependabot
      # and by nothing here. The same script runs locally through `pnpm run audit:ci`, so the two
      # cannot drift.
      - name: Security audit (every lockfile · moderate and above)
        run: pnpm run audit:ci
      - name: Build (packages)
        run: pnpm run build:ci
      # Types are only useful if a consumer can resolve them: an extensionless relative import in a
      # published declaration makes everything it re-exports invisible under `nodenext`.
      - name: Check published declarations
        run: pnpm run check:dts
      # 50 of the 51 published packages re-export a `utils` or `declarations` module wholesale, so a
      # helper added on a Tuesday is public API on Friday's release. The surface is checked in under
      # `api/`, and this fails when the build no longer matches it: adding or removing a public export
      # becomes a reviewed line in a pull request instead of a side effect.
      - name: Check the public API surface
        run: pnpm run api:check
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: stone-js-*/dist
          retention-days: 1

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - run: pnpm run lint:ci

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - name: Test (with coverage)
        run: pnpm run test:ci
      # The lab applications are what the packages look like once assembled: a real SPA, a real SSR
      # app, a real API, each booted through the kernel. They were outside the gate, so a test file
      # that stopped compiling lived there unnoticed until someone ran it by hand. Four seconds, for
      # the only place in this repository where the packages are used the way an application uses
      # them. The starters stay out: they install from the registry, so a CI run cannot point them at
      # the build under test.
      - name: Test the lab applications
        run: pnpm run test:lab
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: stone-js-*/coverage/lcov.info
          retention-days: 1

  # Sonar needs the coverage reports (from Test) and the full git history for new-code/blame.
  # It analyses source only (dist/docs/coverage are excluded in sonar-project.properties), so it
  # needs neither a build nor an install here.
  sonar:
    name: SonarCloud
    needs: test
    # Dependabot pull requests run against the Dependabot secret store, where SONAR_TOKEN does not
    # exist, so the scan can only fail. Skipping is honest; main is analysed on every push anyway,
    # and a dependency bump changes no source line Sonar looks at.
    if: ${{ github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
