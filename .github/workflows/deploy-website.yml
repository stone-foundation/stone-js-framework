name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'stone-js-website/**'
      # The header shows the published version, generated from @stone-js/core's manifest by the
      # site's `sync-version` script at build time. A release commit bumps that manifest without
      # touching stone-js-website/**, so without this path the site kept advertising the previous
      # version until the next unrelated site change.
      - 'stone-js-core/package.json'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

# One deploy at a time; let a newer run supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build (SSG + Pagefind index)
    runs-on: ubuntu-latest
    # Least privilege: the build only reads the repo and uploads the Pages artifact.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Build the framework packages first, in dependency order, with `pnpm -r` (NOT turbo: turbo
      # races the per-file .d.ts emit, so a dependent builds before @stone-js/core's dist exists —
      # "Cannot find module '@stone-js/core'"). Then build the website against the built dist.
      - name: Build framework packages
        run: pnpm run build:ci

      # The website's build script runs `stone build && pagefind --site dist`.
      - name: Build website
        run: pnpm --filter @stone-js/website run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: stone-js-website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job needs to mint the Pages token and publish.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
