name: PR checks

# Repository governance, enforced from the pipeline (local hooks can be bypassed). Mark this job as
# a required status check in branch protection to actually block merges.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance (title · branch · label)
    runs-on: ubuntu-latest
    steps:
      # Cheap checks first (no install), so a bad branch/label fails fast.
      - name: Branch name follows <type>/<slug>
        env:
          # Pass through env, never interpolate ${{ }} into the script: github.head_ref is
          # attacker-controlled (branch name) and would otherwise allow shell injection.
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          name="$BRANCH_NAME"
          echo "Branch: $name"
          # `changeset-release` and `dependabot` are bot-owned namespaces: neither tool lets you
          # choose the branch name, so requiring <type>/<slug> of them would fail every one of their
          # pull requests forever. Their titles still go through commitlint below, which is what
          # actually lands on main.
          if ! printf '%s' "$name" | grep -qE '^(changeset-release|dependabot|feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert)/[a-z0-9][a-z0-9._/-]*$'; then
            echo "::error::Branch '$name' must be <type>/<slug> (types: feat, fix, chore, docs, refactor, perf, test, build, ci, style, revert), e.g. feat/mcp-dev."
            exit 1
          fi

      - name: PR has at least one label
        run: |
          count=$(jq '.pull_request.labels | length' "$GITHUB_EVENT_PATH")
          echo "Label count: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::Add at least one label to this PR (needed for triage and release notes)."
            exit 1
          fi

      # The PR title becomes the squash-merge commit on main, so it must pass the same commitlint
      # rules as any commit. Reuse the repo's commitlint config for a single source of truth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A `fixed` group means every package lands on the same version, so the group's bump is the
      # highest one declared anywhere in it. On a 0.x line the minor slot is the breaking slot, which
      # is why a single `minor` promoted the whole group to a major and took 0.8.9 to 1.0.0, silently,
      # in a release nobody had asked to be the first stable one. Until the API freeze every bump
      # stays a patch, and the one deliberate jump is made by hand with the label below.
      - name: Pre-1.0 changesets declare patch only
        run: |
          version=$(jq -r .version stone-js-core/package.json)
          echo "Current line: $version"
          case "$version" in
            0.*) ;;
            *) echo "Past 1.0, nothing to enforce."; exit 0 ;;
          esac

          if jq -e '[.pull_request.labels[].name] | index("release: intentional bump")' "$GITHUB_EVENT_PATH" > /dev/null; then
            echo "Labelled as a deliberate bump, so the rule is waived for this PR."
            exit 0
          fi

          offenders=$(grep -rlE '^ *.@stone-js/[^"'\'']+.: *(minor|major) *$' .changeset/*.md 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "::error::On a $version line every changeset must declare 'patch'. A minor or major anywhere in the fixed group bumps every package to the next major (1.0.0). Offending files:%0A$offenders%0AUse patch, or add the label 'release: intentional bump' if the jump is deliberate."
            exit 1
          fi
          echo "Every changeset declares patch."

      # The `fixed` group is listed package by package, so a new module is in it only if someone
      # remembered to add it. One that was forgotten versions on its own: it drifts off the shared
      # line, and an application installing the set gets one package from a different release than
      # every other. The group is the release contract, so membership is checked rather than trusted.
      - name: Every published package is in the fixed group
        run: |
          missing=$(
            for pkg in stone-js*/package.json; do
              jq -r 'select(.private != true) | .name' "$pkg"
            done | while read -r name; do
              jq -e --arg n "$name" '.fixed[0] | index($n)' .changeset/config.json > /dev/null || echo "  $name"
            done
          )
          if [ -n "$missing" ]; then
            echo "::error::These published packages are absent from the \`fixed\` group in .changeset/config.json, so they would version on their own instead of on the shared line:%0A$missing"
            exit 1
          fi
          echo "Every published package is in the fixed group."

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: PR title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint
